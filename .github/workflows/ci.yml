name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token for every job in this workflow.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.23", "1.24"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        shell: bash
        run: go build -ldflags "-X main.version=$(cat VERSION | tr -d '[:space:]')" -o triton .

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Verify --version flag
        shell: bash
        run: go run -ldflags "-X main.version=$(cat VERSION | tr -d '[:space:]')" . --version

      - name: Verify -h flag
        run: go run . -h || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"

      - name: Vet
        run: go vet ./...

      - name: Static check
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"

      - name: Test with coverage
        run: go test ./... -coverprofile=cover.out

      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          awk "BEGIN{ exit !(${total} >= 35) }" || { echo "Coverage ${total}% is below the 35% floor"; exit 1; }

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Use the latest patched Go so govulncheck sees the current standard
      # library, matching the toolchain the release job ships with.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"

      # Rules excluded below are structurally inherent to a reconnaissance CLI
      # and carry no signal here: G104 (ignored cleanup errors), G115 (bounded
      # int->byte conversions in the SOCKS5 codec), G204 (the single traceroute
      # subprocess, invoked only with a validated address and fixed flags),
      # G302 (the updater's replacement binary must stay executable), G304/G306
      # (reading and writing operator-specified file paths and shareable
      # reports), G703 (paths from operator-supplied flags). G402
      # (InsecureSkipVerify) is kept active and justified inline with #nosec.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -exclude=G104,G115,G204,G302,G304,G306,G703 -exclude-dir=scripts ./...
