name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write # record the build provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Build release binaries with the latest patched Go so the shipped
      # standard library carries current security fixes.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          platforms=(
            "linux/amd64" "linux/arm64"
            "darwin/amd64" "darwin/arm64"
            "windows/amd64" "windows/arm64"
          )
          for p in "${platforms[@]}"; do
            os="${p%/*}"; arch="${p#*/}"
            bin="triton"; ext="tar.gz"
            [ "$os" = "windows" ] && bin="triton.exe" && ext="zip"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VER}" -o "$bin" .
            asset="triton_${VER}_${os}_${arch}.${ext}"
            if [ "$ext" = "zip" ]; then
              zip -q "dist/${asset}" "$bin"
            else
              tar -czf "dist/${asset}" "$bin"
            fi
            rm -f "$bin"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/triton.sbom.spdx.json

      - name: Checksum and sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Include the SBOM in the manifest so it is covered by the checksums
          # (and the optional signature over them), not just uploaded loose.
          ( cd dist && sha256sum triton_* triton.sbom.spdx.json > SHA256SUMS && cat SHA256SUMS )
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "signing SHA256SUMS"
            go run ./scripts/sign -key-env RELEASE_SIGNING_KEY -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          else
            echo "RELEASE_SIGNING_KEY not set; publishing checksums without a signature"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # Matches the archives and the SBOM, but not SHA256SUMS(.sig).
          subject-path: "dist/triton*"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
